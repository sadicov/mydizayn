<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Porsche 911 Konfigurator</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        img {
            width: 400px;
            transition: transform 0.5s, filter 0.5s;
        }

        .controls button {
            margin: 5px;
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Porsche 911 Konfigurator</h1>

    <!-- RASM -->
    <img id="car" src="porsche.png" alt="Porsche 911">

    <div class="controls">
        <h3>Rang</h3>
        <button onclick="setColor('red')">Qizil</button>
        <button onclick="setColor('blue')">Ko‘k</button>
        <button onclick="setColor('white')">Oq</button>

        <h3>Aylantirish</h3>
        <button onclick="rotate()">Aylantir</button>

        <h3>Oyna</h3>
        <button onclick="glass()">Qora oyna</button>
    </div>

    <h2>Narx: <span id="price">120000</span> $</h2>

<script>
    let price = 120000;
    let angle = 0;

    function setColor(color) {
        document.getElementById("car").style.filter =
            `drop-shadow(0 0 30px ${color})`;
        price += 2000;
        updatePrice();
    }

    function rotate() {
        angle += 20;
        document.getElementById("car").style.transform =
            `rotateY(${angle}deg)`;
    }

    function glass() {
        document.getElementById("car").style.filter += " brightness(0.7)";
        price += 1500;
        updatePrice();
    }

    function updatePrice() {
        document.getElementById("price").innerText = price;
    }
</script>

</body>
</html>
