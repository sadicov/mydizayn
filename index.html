<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Car Configurator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{
    background:#111;color:#fff;
    min-height:100vh;
    display:flex;justify-content:center;align-items:center;
}
.app{width:1100px;max-width:95%;display:flex;gap:30px}

.viewer{
    flex:1;background:#1c1c1c;border-radius:20px;
    display:flex;justify-content:center;align-items:center;
    position:relative;overflow:hidden;
}
.car{
    width:420px;
    cursor:grab;
    transition:.3s;
}
.wheel{
    fill:#aaa;
}
.spoiler{
    fill:#000;
    display:none;
}

.controls{
    width:340px;background:#1a1a1a;
    border-radius:20px;padding:25px;
}
.section{margin-bottom:18px}
.colors{display:flex;gap:10px}
.color{
    width:24px;height:24px;border-radius:50%;
    border:2px solid #fff;cursor:pointer;
}
button{
    width:100%;padding:10px;margin-top:8px;
    background:#ff4d00;border:none;border-radius:10px;
    color:#fff;font-size:15px;cursor:pointer;
}
.price{
    margin-top:15px;
    background:#000;padding:12px;border-radius:10px;
    text-align:center;font-size:22px;font-weight:bold;
}
</style>
</head>
<body>

<div class="app">

<!-- VIEW -->
<div class="viewer" id="viewer">

<svg id="car" class="car" viewBox="0 0 600 250">
    <!-- BODY -->
    <rect id="body" x="80" y="90" width="420" height="80" rx="40" fill="red"/>
    <rect x="180" y="50" width="240" height="70" rx="35" fill="#222"/>

    <!-- WINDOWS -->
    <rect id="window" x="210" y="60" width="180" height="50" rx="20" fill="#555"/>

    <!-- WHEELS -->
    <circle id="wheelL" class="wheel" cx="180" cy="180" r="28"/>
    <circle id="wheelR" class="wheel" cx="420" cy="180" r="28"/>

    <!-- SPOILER -->
    <rect id="spoiler" class="spoiler" x="450" y="80" width="80" height="10" rx="5"/>
</svg>

</div>

<!-- CONTROLS -->
<div class="controls">
    <h2>Porsche 911</h2>

    <div class="section">
        <b>🎨 Rang</b>
        <div class="colors">
            <div class="color" style="background:red" onclick="setColor('red',0)"></div>
            <div class="color" style="background:blue" onclick="setColor('blue',500)"></div>
            <div class="color" style="background:black" onclick="setColor('#222',800)"></div>
        </div>
    </div>

    <div class="section">
        <b>🛞 Disk</b>
        <button onclick="setWheel('#aaa',0)">Oddiy</button>
        <button onclick="setWheel('#000',1200)">Sport</button>
    </div>

    <div class="section">
        <b>🪟 Oyna</b>
        <button onclick="setWindow('#555',0)">Oddiy</button>
        <button onclick="setWindow('#111',700)">Qora tint</button>
    </div>

    <div class="section">
        <b>🧩 Qo‘shimcha</b>
        <button onclick="toggleSpoiler()">Spoiler (+1500)</button>
    </div>

    <div class="price" id="price">$80,000</div>
</div>

</div>

<script>
let base=80000,total=base;
let rotate=0,isDown=false;

const body=document.getElementById("body");
const wL=document.getElementById("wheelL");
const wR=document.getElementById("wheelR");
const win=document.getElementById("window");
const spoiler=document.getElementById("spoiler");
const viewer=document.getElementById("viewer");
const car=document.getElementById("car");
const price=document.getElementById("price");

function update(){price.innerText="$"+total.toLocaleString()}

viewer.onmousedown=()=>isDown=true;
window.onmouseup=()=>isDown=false;
viewer.onmousemove=e=>{
    if(!isDown)return;
    rotate+=e.movementX;
    car.style.transform=`rotateY(${rotate}deg)`;
}

function setColor(c,p){body.setAttribute("fill",c);total=base+p;update()}
function setWheel(c,p){wL.setAttribute("fill",c);wR.setAttribute("fill",c);total=base+p;update()}
function setWindow(c,p){win.setAttribute("fill",c);total=base+p;update()}

function toggleSpoiler(){
    if(spoiler.style.display==="block"){
        spoiler.style.display="none";total-=1500;
    }else{
        spoiler.style.display="block";total+=1500;
    }
    update();
}

update();
</script>

</body>
</html>
